<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Червячный сортировщик</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: one centred notebook-paper game card; round pips and score on top, a specimen plate in the middle, three dashed bins below. */
:root {
  --bg: #f4f9e3; --surface: #fffefa; --fg: #25341a; --muted: #5d6e4f;
  --line: #a9c24f; --grid: rgba(111,154,28,.11);
  --g: #6f9a1c; --gs: #e3f1b5;
  --p: #c2337c; --ps: #fde1ee; --pb: #e58ab4;
  --c: #b8742f; --cs: #fbe5c8; --cb: #e0a45f;
  --ok: #3f8a1f; --bad: #c63b3b; --on-p: #ffffff;
  --art: #fbfdf0;
  --disp: "Unbounded", "Nunito", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a0f; --surface: #1b2716; --fg: #ecf4dc; --muted: #a7b896;
    --line: #55702a; --grid: rgba(166,207,90,.07);
    --g: #a6cf5a; --gs: #2a3b1d;
    --p: #f08cbc; --ps: #3a1d2b; --pb: #8a4468;
    --c: #f0b886; --cs: #3b2b1a; --cb: #8a6232;
    --ok: #8fd35a; --bad: #ff9a9a; --on-p: #2a0f1d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a0f; --surface: #1b2716; --fg: #ecf4dc; --muted: #a7b896;
  --line: #55702a; --grid: rgba(166,207,90,.07);
  --g: #a6cf5a; --gs: #2a3b1d;
  --p: #f08cbc; --ps: #3a1d2b; --pb: #8a4468;
  --c: #f0b886; --cs: #3b2b1a; --cb: #8a6232;
  --ok: #8fd35a; --bad: #ff9a9a; --on-p: #2a0f1d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.4;
  padding-block: 16px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
.app { max-width: 520px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--p); outline-offset: 3px; }

/* top bar */
.top { display: flex; flex-direction: column; gap: 10px; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.tag { font-family: var(--disp); font-weight: 800; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase;
  background: var(--g); color: var(--surface); padding: 7px 14px; border-radius: 999px; }
.stats { display: flex; align-items: center; gap: 12px; }
.score { font-family: var(--disp); font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; }
.score small { font-family: var(--body); font-weight: 700; font-size: .7rem; color: var(--muted); margin-right: 4px; text-transform: uppercase; letter-spacing: .06em; }
.hearts { display: flex; gap: 3px; }
.hearts svg { width: 22px; height: 22px; display: block; }
.pips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pip { height: 8px; border-radius: 999px; border: 2px dashed var(--line); }
.pip.done { background: var(--g); border: 2px solid var(--g); }
.pip.now { background: var(--pb); border: 2px solid var(--pb); }

/* panels */
.panel { background: var(--surface); border: 2px dashed var(--line); border-radius: 22px; padding: 18px; }
.rhead { display: flex; flex-direction: column; gap: 2px; }
.rname { font-weight: 800; font-size: 1.05rem; }
.hint { margin: 0; color: var(--muted); font-weight: 600; font-size: .92rem; }

.card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  min-height: 250px; justify-content: center; animation: pop .35s ease-out; }
.eyebrow { align-self: flex-start; font-size: .72rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--p); }
.count { position: absolute; top: 14px; right: 16px; font-size: .78rem; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.plate { width: 100%; max-width: 300px; aspect-ratio: 8 / 5; background: var(--art); border-radius: 16px; border: 2px solid var(--gs); }
.plate svg { width: 100%; height: 100%; display: block; }
.label { font-weight: 800; font-size: 1.2rem; line-height: 1.25; text-wrap: balance; max-width: 30ch; }
.clue { font-weight: 800; font-size: 1.22rem; line-height: 1.3; text-wrap: balance; max-width: 28ch; padding-block: 18px; }
.card.right { animation: fly .5s ease-in forwards; }
.card.wrong { animation: shake .4s; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fly { to { transform: translateY(26px) scale(.9); opacity: .35; } }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

/* bins */
.bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.bin { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px 10px; border-radius: 18px;
  border: 2px dashed; font-weight: 800; font-size: .95rem; min-width: 0; position: relative; transition: transform .12s; }
.bin:hover:not(:disabled) { transform: translateY(-2px); }
.bin:disabled { cursor: default; }
.bin svg { width: 54px; height: 30px; }
.bin kbd { position: absolute; top: 6px; left: 8px; font: 800 .68rem var(--body); color: var(--muted); }
.bin.k { background: var(--gs); border-color: var(--g); }
.bin.p { background: var(--ps); border-color: var(--pb); }
.bin.n { background: var(--cs); border-color: var(--cb); }
.bin.key-right { outline: 4px solid var(--ok); outline-offset: 2px; }
.bin.key-wrong { opacity: .55; }

/* feedback */
.fb { min-height: 104px; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; justify-content: center;
  border: 2px dashed var(--line); background: var(--surface); }
.fb.idle { color: var(--muted); font-weight: 700; font-size: .9rem; align-items: center; text-align: center; }
.fb .head { font-weight: 800; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.fb .ok { color: var(--ok); } .fb .bad { color: var(--bad); }
.fb .combo { font-size: .8rem; color: var(--p); }
.fb p { margin: 0; font-size: .92rem; font-weight: 600; color: var(--muted); }
.btn { font-family: var(--disp); font-weight: 800; font-size: .82rem; letter-spacing: .03em; border: 0; border-radius: 999px;
  padding: 12px 22px; background: var(--p); color: var(--on-p); align-self: flex-start; }
.btn.alt { background: transparent; color: var(--fg); border: 2px dashed var(--line); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }

/* start / result */
.hero { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
h1 { font-family: var(--disp); font-weight: 800; font-size: clamp(1.45rem, 6.4vw, 2rem); line-height: 1.12; margin: 0; text-wrap: balance; }
h1 em { font-style: normal; color: var(--p); }
.lead { margin: 0; font-weight: 600; color: var(--muted); max-width: 44ch; }
.legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.legend .bin { cursor: default; font-size: .9rem; }
.rules { margin: 0; padding-left: 18px; font-weight: 600; font-size: .92rem; color: var(--muted); display: grid; gap: 3px; }
.stars { display: flex; gap: 6px; }
.stars svg { width: 44px; height: 44px; }
.big { font-family: var(--disp); font-weight: 800; font-size: 2.2rem; font-variant-numeric: tabular-nums; line-height: 1; }
.rank { font-family: var(--disp); font-weight: 800; font-size: 1.15rem; color: var(--p); }
.best { font-weight: 700; font-size: .85rem; color: var(--muted); }
.note { font-size: .8rem; color: var(--muted); font-weight: 600; text-align: center; margin: 0; }

@media (max-width: 400px) {
  .panel { padding: 14px; }
  .bin { font-size: .86rem; } .bin svg { width: 46px; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .card.right, .card.wrong { animation: none; }
  .bin { transition: none; }
}
</style>

<div class="app" id="app">
  <div class="top" id="top"></div>
  <main id="view"></main>
</div>

<script>
(function () {

  var INK = '#4a3d2e';
  function svg(inner) { return '<svg viewBox="0 0 160 100" aria-hidden="true">' + inner + '</svg>'; }
  function tube(d, w, fill, edge, extra) {
    return '<path d="' + d + '" fill="none" stroke="' + edge + '" stroke-width="' + (w + 3) + '" stroke-linecap="round" stroke-linejoin="round"/>' +
           '<path d="' + d + '" fill="none" stroke="' + fill + '" stroke-width="' + w + '" stroke-linecap="round" stroke-linejoin="round" ' + (extra || '') + '/>';
  }
  function dot(x, y, r, f) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + (f || INK) + '"/>'; }
  function line(x1, y1, x2, y2, c, w) { return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="' + c + '" stroke-width="' + (w || 2) + '" stroke-linecap="round"/>'; }

      '<path d="' + d + '" fill="none" stroke="#efb3a8" stroke-width="15" stroke-dasharray="0 46 20 600"/>' + dot(20, 66, 1.6));

           line(x - 2, 45, x - 8, 39, edge, 1.4) + line(x - 2, 63, x - 8, 69, edge, 1.4);
    }
    if (variant) { for (i = 0; i < 4; i++) { x = 60 + i * 12; s += '<path d="M' + x + ' 48 q -3 -12 -8 -14 M' + x + ' 48 q 2 -12 4 -16" fill="none" stroke="#d6455a" stroke-width="2" stroke-linecap="round"/>'; } }
    s += tube('M22 54 L146 54', 12, body, edge);

    s += '<circle cx="20" cy="54" r="8" fill="' + body + '" stroke="' + edge + '" stroke-width="2.5"/>' + dot(17, 51, 1.8) + dot(17, 57, 1.8) +
         line(14, 49, 6, 41, edge, 1.8) + line(14, 59, 6, 67, edge, 1.8);

  }
  function leech() {
    return svg('<path d="M26 56 C 40 36, 100 36, 134 50 C 140 53, 140 57, 134 60 C 100 74, 40 72, 26 56Z" fill="#4a3d58" stroke="#2b2236" stroke-width="3"/>' +
      '<path d="M34 55 C 70 49, 100 51, 128 55" fill="none" stroke="#e08a4a" stroke-width="2.4" stroke-dasharray="5 5" stroke-linecap="round"/>' +
      '<ellipse cx="24" cy="56" rx="7" ry="9" fill="#7a6a8c" stroke="#2b2236" stroke-width="2.5"/><ellipse cx="139" cy="55" rx="8" ry="6.5" fill="#7a6a8c" stroke="#2b2236" stroke-width="2.5"/>' +
      '<path d="M20 56 h8" stroke="#2b2236" stroke-width="2.4" stroke-linecap="round"/>');
  }
  function planaria() {
    return svg('<path d="M24 50 L12 39 L32 44Z M24 50 L12 61 L32 56Z" fill="#cba38f" stroke="#8d6a58" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="M22 50 C 44 36, 96 38, 132 47 C 148 51, 148 53, 132 57 C 96 66, 44 64, 22 50Z" fill="#cba38f" stroke="#8d6a58" stroke-width="3"/>' +
      '<path d="M66 52 L102 52" stroke="#8d6a58" stroke-width="5" stroke-linecap="round" stroke-opacity=".55"/>' +
      '<circle cx="36" cy="46.5" r="4" fill="#fff"/><circle cx="36" cy="53.5" r="4" fill="#fff"/>' + dot(37, 47, 1.8) + dot(37, 53, 1.8));
  }
  function fluke() {
    var s = '<path d="M80 10 C 116 24 122 66 80 92 C 38 66 44 24 80 10Z" fill="#d98066" stroke="#98472f" stroke-width="3"/>', i;

  function tape(o) {
    var s = '', i, x, h, y, f = o.fill, e = o.edge;
    for (i = 0; i < o.n; i++) {
      x = o.x0 + i * o.step; h = o.h0 + (o.h1 - o.h0) * i / Math.max(1, o.n - 1); y = 50 - h / 2 + Math.sin(i * .75) * o.wob;

  function nema(d, w, fill, edge, extra) { return svg(tube(d, w, fill, edge) + (extra || '')); }
  var ART = {
    earth: earth, nereis: function () { return bristle(false); }, lug: function () { return bristle(true); }, leech: leech,

    ascaris: function () { return nema('M16 70 C 50 20, 80 95, 112 48 S 150 30, 146 58', 9, '#efc77a', '#a67b2b', '<path d="M16 70 C 50 20, 80 95, 112 48" fill="none" stroke="#fff2cf" stroke-opacity=".55" stroke-width="2.5" stroke-linecap="round"/>'); },
    pinworm: function () { return nema('M50 64 C 70 42, 100 40, 118 56', 5, '#f6f0e0', '#8a7e66', '<path d="M118 56 L134 66" stroke="#8a7e66" stroke-width="2" stroke-linecap="round"/>'); },
    whip: function () { return svg(tube('M18 40 C 46 24, 70 54, 92 50', 2.5, '#e9d8b4', '#8a7658') + tube('M92 50 C 112 46, 128 66, 144 62', 9, '#e9d8b4', '#8a7658')); },

    guinea: function () { return nema('M12 78 C 30 20, 50 20, 60 55 S 90 100, 104 55 S 130 16, 148 48', 6, '#efe2c4', '#8f7c58'); }
  };
  function slice(inner) { return svg(inner); }
  ART.coelom = function () {
    return slice('<circle cx="80" cy="50" r="42" fill="#fbe3ee" stroke="#7da21f" stroke-width="6"/><circle cx="80" cy="50" r="35" fill="#fff6e0" stroke="#e07aa8" stroke-width="4"/>' +
      line(80, 36, 80, 16, '#e07aa8', 3) + line(80, 64, 80, 84, '#e07aa8', 3) +
      '<circle cx="80" cy="50" r="15" fill="#e3f1b5" stroke="#e07aa8" stroke-width="5"/><circle cx="80" cy="50" r="7" fill="#fff6e0" stroke="#7da21f" stroke-width="2"/>');
  };
  ART.pseudo = function () {
    var s = '<circle cx="80" cy="50" r="42" fill="#fff6e0" stroke="#7da21f" stroke-width="6"/>', i, a, x, y;

  };

    $view.innerHTML = '<section class="panel hero"><span class="rank">' + rank + '</span><div class="big">' + st.score + '</div>' +
      '<p class="lead">Точность ' + acc + '%: ' + st.hits + ' верных ответов из ' + st.tries + '.</p>' +
      '<span class="best">' + (isBest ? 'Новый рекорд!' : 'Лучший результат: ' + best) + '</span>' +
      '<button class="btn" id="again">Играть снова</button></section>';
    document.getElementById('again').onclick = newGame;
  }

  document.addEventListener('keydown', function (e) {
    if (!st || st.view !== 'play' || st.locked || e.ctrlKey || e.metaKey || e.altKey) { return; }
    var k = { '1': 'K', '2': 'P', '3': 'N' }[e.key];
    if (k) { answer(k); }
  });

  st = { view: 'start', score: 0, lives: 3, r: 0 };
  viewStart();
})();
</script>

</body></html>
